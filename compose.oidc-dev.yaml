services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zdos_dev
      POSTGRES_USER: zdos_dev_user
      POSTGRES_PASSWORD: zdos-dev-only-password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - zdos-oidc-dev-db:/var/lib/postgresql/data
      - ./database/dev-init.sql:/docker-entrypoint-initdb.d/10-keycloak-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zdos_dev_user -d zdos_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/zdos_dev
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: zdos_dev_user
      KC_DB_PASSWORD: zdos-dev-only-password
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only-password
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/keycloak-dev-realm.json:/opt/keycloak/data/import/zdos-dev-realm.json:ro

volumes:
  zdos-oidc-dev-db:
